name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        version: [ "1.21.8", "1.21.11", "26.1" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build ${{ matrix.version }} target
        run: ./gradlew :${{ matrix.version }}:build --stacktrace

      - name: Upload artifacts for ${{ matrix.version }}
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: soundboard-${{ matrix.version }}
          path: versions/${{ matrix.version }}/build/libs/*.jar
          if-no-files-found: warn

  compile-check:
    name: Compilation Check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        version: [ "26.1" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Check Kotlin compilation for ${{ matrix.version }}
        run: ./gradlew :${{ matrix.version }}:compileKotlin --no-daemon --stacktrace

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [ build, compile-check ]
    if: always()
    steps:
      - name: Print build status
        run: |
          echo "Build Results:"
          echo "- 1.21.8 (baseline): ${{ needs.build.result }}"
          echo "- 1.21.11 (owo-lib 0.13): ${{ needs.build.result }}"
          echo "- 26.1 (mojmap): ${{ needs.build.result }}"
          echo ""
          echo "Compilation Check: ${{ needs.compile-check.result }}"
